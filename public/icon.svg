<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle gold border line -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="4" />

  <!-- Shield Base (Safe Zone) -->
  <path d="M256 80 L380 135 C380 270 256 380 256 420 C256 380 132 270 132 135 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Center OX Monogram & Lightning Bolt / Spark -->
  <!-- Letter O / Hex ring -->
  <circle cx="256" cy="220" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Sparkles / Diamond Star -->
  <path d="M256 182 L266 210 L294 220 L266 230 L256 258 L246 230 L218 220 L246 210 Z" fill="#fbbf24" />

  <!-- Bottom checkmark / wings -->
  <path d="M200 320 L240 355 L315 285" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
